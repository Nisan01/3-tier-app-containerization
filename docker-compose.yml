services:
    
    db:
      build: ./database
      container_name: mysqldb
      restart: always
      environment:
       MYSQL_ROOT_PASSWORD: root  
       MYSQL_DATABASE: appdb

      volumes:
       - ./database/init.sql:/docker-entrypoint-initdb/init.sql
       - database-bridge-vol:/var/lib/mysql
      
      healthcheck:
       test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
       interval: 5s
       timeout: 5s
       retries: 10
       start_period: 10s
     
      
      networks:
       - myapp-network




    backend:
      build: ./backend
      container_name: backend-service
      restart: always
      environment:
        DB_HOST: db
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: appdb
      ports:
       - 3000:3000
      
      depends_on:
       db:
        condition: service_healthy

      networks:
       - myapp-network






    frontend:
       build: ./frontend
       container_name: frontend-service
       restart: always
       ports:
         - 8080:80
       depends_on:
         - backend
       networks:
         - myapp-network
 





networks:
  myapp-network:
   driver: bridge



volumes:
 database-bridge-vol: